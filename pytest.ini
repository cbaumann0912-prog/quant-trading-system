[pytest]
# Restrict collection to the test suite. Without this, pytest walks the whole
# repository and collects research/**/*_test.py -- analysis scripts that load
# data and run pipelines at module import time. Those are research artifacts,
# not tests: collecting them executes full backtests during the collection
# phase, inflates suite runtime, and makes the suite fail anywhere the raw
# minute CSVs are absent (any clean checkout, and the Docker image).
testpaths = tests
